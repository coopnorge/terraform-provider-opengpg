name: CI/CD
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      techdocs: ${{ steps.changes.outputs.techdocs == 'true' || steps.changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          list-files: json
          filters: |
            techdocs:
              - 'docs/**'
              - 'devtools/techdocs.*'
              - '.vale/**'
            workflows:
              - '.github/workflows/**'
      - name: Debug ...
        run: |
          echo ::${{ steps.changes.outputs }}

  mage:
    uses: coopnorge/mage/.github/workflows/mage.yaml@b8f6347b5d938d692b3300bc107714e3a42f93a7 # v0.47.0
    permissions:
      contents: read
      id-token: write
      packages: read
    secrets: inherit

  techdocs:
    needs: setup
    if: needs.setup.outputs.techdocs == 'true'
    concurrency:
      group: ${{ github.repository }}-${{ github.workflow }}-techdocs-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: coopnorge/github-workflow-techdocs/.github/workflows/techdocs.yaml@v0.6.1

  build:
    needs:
      - mage
      - techdocs
    if: failure() || cancelled()
    runs-on: ubuntu-slim
    steps:
      - run: exit 1
        name: "Catch errors"
    permissions: {}
